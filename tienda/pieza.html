<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pródigo – Pieza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="papel" data-seccion="tienda">

  <header class="cabecera" id="cabecera"></header>
  <script src="cabecera.js"></script>

  <main class="ficha" id="ficha"><p>Cargando…</p></main>

  <script src="api.js"></script>
  <script>
    // Datos de catalogación que se muestran si están completos (campo de la base, etiqueta)
    const CAMPOS = [
      ["coleccion", "Colección"], ["fotografo", "Fotógrafo"], ["fecha", "Fecha"],
      ["proceso", "Proceso"], ["soporte", "Soporte"], ["medidas", "Medidas"],
      ["inscripciones", "Inscripciones"], ["conservacion", "Estado de conservación"],
      // Postales
      ["editorial", "Editorial"], ["lugar", "Lugar"], ["tecnica", "Técnica"], ["color", "Color"], ["circulada", "Circulación"],
      // Máquinas de escribir
      ["marca", "Marca"], ["modelo", "Modelo"], ["origen", "País de origen"], ["numero_serie", "N.º de serie"],
      ["teclado", "Teclado"], ["funcionamiento", "Funcionamiento"]
    ];

    const ficha = document.getElementById("ficha");
    const params = new URLSearchParams(location.search);

    function noEncontrada() {
      document.title = "Pródigo – Pieza no encontrada";
      ficha.innerHTML = `<div class="vacio"><h1>No encontramos esa pieza</h1><p>Puede que ya no esté en el catálogo.</p><a class="boton" href="tienda.html">Volver al catálogo</a></div>`;
    }

    async function iniciar() {
      let p;
      try {
        p = await obtenerPieza(params.get("c") || "", params.get("id") || "");
      } catch (err) {
        console.error(err);
        return noEncontrada();
      }

      document.title = `Pródigo – ${p.titulo}`;
      const archivos = archivosDe(p);
      const vistas = archivos.length
        ? archivos.map((f, i) => ({ src: urlImagen(p, f, "1200x0"), etiqueta: archivos.length > 1 ? `Vista ${i + 1}` : "Imagen principal" }))
        : [{ src: "", etiqueta: "Imagen principal" }];

      const placa = v => v.src
        ? `<img src="${esc(v.src)}" alt="${esc(p.titulo)}: ${esc(v.etiqueta)}">`
        : `<span>${esc(String(p.titulo || "?").charAt(0))}</span>`;

      const filas = CAMPOS.filter(([k]) => p[k]).map(([k, et]) => `<dt>${et}</dt><dd>${esc(p[k])}</dd>`).join("");
      const consulta = `mailto:contacto@ejemplo.com?subject=${encodeURIComponent("Consulta por " + p.titulo + " (" + p.id + ")")}`;

      ficha.innerHTML = `
        <a class="volver" href="tienda.html">Volver al catálogo</a>
        <div class="ficha-cuerpo">
          <div class="ficha-imagenes">
            <div class="visor placa" id="visor">${placa(vistas[0])}</div>
            ${vistas.length > 1 ? `<div class="miniaturas" role="group" aria-label="Vistas de la pieza">
              ${vistas.map((v, i) => `<button type="button" class="miniatura" data-i="${i}" aria-pressed="${i === 0}" aria-label="${esc(v.etiqueta)}"><span class="placa">${placa(v)}</span><small>${esc(v.etiqueta)}</small></button>`).join("")}
            </div>` : ""}
            ${p.credito ? `<p class="credito">${esc(p.credito)}</p>` : ""}
          </div>
          <div class="ficha-datos">
            <h1>${esc(p.titulo)}</h1>
            ${formatoPrecio(p) ? `<p class="precio-grande">${esc(formatoPrecio(p))}</p>` : ""}
            ${p.estado ? `<span class="estado ${p.estado === "Reservada" ? "reservada" : ""}">${esc(p.estado)}</span>` : ""}
            ${p.descripcion ? `<p style="margin-top:1rem">${esc(p.descripcion)}</p>` : ""}
            ${filas ? `<dl>${filas}</dl>` : ""}
            <a class="boton" href="${consulta}">${p.estado === "Reservada" ? "Consultar disponibilidad" : "Consultar por esta pieza"}</a>
          </div>
        </div>`;

      // Cambiar de vista con las miniaturas
      ficha.addEventListener("click", e => {
        const b = e.target.closest(".miniatura");
        if (!b) return;
        document.getElementById("visor").innerHTML = placa(vistas[Number(b.dataset.i)]);
        ficha.querySelectorAll(".miniatura").forEach(x => x.setAttribute("aria-pressed", x === b));
      });
    }

    iniciar();
  </script>
</body>
</html>
