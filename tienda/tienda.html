<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pródigo – Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="papel" data-seccion="tienda">

  <header class="cabecera" id="cabecera"></header>
  <script src="cabecera.js"></script>

  <div class="disposicion">
    <aside class="lateral" id="lateral" aria-label="Categorías y filtros">
      <div class="lateral-cabeza"><span class="marca">Filtrar</span><button type="button" id="cerrar" aria-label="Cerrar">×</button></div>
      <h2 class="etiqueta">Categorías</h2>
      <ul class="lista-cats" id="lista-categorias"></ul>
      <div id="filtros"></div>
    </aside>

    <main aria-live="polite">
      <div class="barra-lista">
        <div>
          <h1 id="titulo-lista">Todas las piezas</h1>
          <p id="cantidad"></p>
        </div>
        <div class="herramientas">
          <button type="button" class="boton-filtros" id="abrir">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            Filtrar
          </button>
          <label class="buscador">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="busqueda" placeholder="Buscar piezas" aria-label="Buscar piezas">
          </label>
          <label class="orden">Ordenar
            <select id="orden">
              <option value="">Más recientes</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="titulo">Título A–Z</option>
            </select>
          </label>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="grilla" id="grilla"><p>Cargando…</p></div>
    </main>
  </div>
  <div class="velo" id="velo" hidden></div>

  <script src="api.js"></script>
  <script>
    const TODAS = "todas";
    let categorias = [];
    let piezas = [];
    let activa = TODAS;
    let filtros = {};   // campo -> Set de valores elegidos, dentro de la categoría activa. Dentro de un campo es "o", entre campos es "y".

    // Especificaciones por las que se puede filtrar en cada categoría (slug: [campo, etiqueta]).
    // Las opciones salen de los valores que tienen las piezas cargadas.
    const FILTROS = {
      fotografias: [["fotografo", "Fotógrafo"], ["coleccion", "Colección"], ["soporte", "Soporte"], ["proceso", "Proceso"]],
      postales: [["color", "Color"], ["lugar", "Lugar"], ["editorial", "Editorial"], ["circulada", "Circulación"]],
      maquinas_de_escribir: [["marca", "Marca"], ["origen", "País de origen"], ["funcionamiento", "Funcionamiento"], ["teclado", "Teclado"]],
    };

    const $ = id => document.getElementById(id);
    const grilla = $("grilla");

    const deCategoria = slug => slug === TODAS ? piezas : piezas.filter(p => p._cat.slug === slug);
    const precioDe = p => Number(p.precio_usd ?? p.precio) || 0;
    // Para buscar sin importar mayúsculas ni tildes
    const normalizar = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

    // Valores distintos de un campo dentro de una lista de piezas, con su cantidad
    function valores(lista, campo) {
      const cuenta = {};
      lista.forEach(p => { if (p[campo]) cuenta[p[campo]] = (cuenta[p[campo]] || 0) + 1; });
      return Object.entries(cuenta).sort((a, b) => a[0].localeCompare(b[0], "es"));
    }

    function pintarCategorias() {
      const items = [{ slug: TODAS, nombre: "Todas" }, ...categorias];
      $("lista-categorias").innerHTML = items.map(c => `<li><button type="button" data-cat="${esc(c.slug)}" aria-pressed="${c.slug === activa}">
        <span>${esc(c.nombre)}</span><span>${deCategoria(c.slug).length}</span></button></li>`).join("");
    }

    function pintarFiltros() {
      const enCat = deCategoria(activa);
      const grupos = (FILTROS[activa] || []).map(([campo, etiqueta]) => [campo, etiqueta, valores(enCat, campo)]).filter(g => g[2].length);
      $("filtros").innerHTML = grupos.length
        ? `<h2 class="etiqueta">Filtros</h2>` + grupos.map(([campo, etiqueta, vals], i) => `
          <details class="grupo"${i < 2 || filtros[campo]?.size ? " open" : ""}>
            <summary>${esc(etiqueta)}</summary>
            <div class="opciones">${vals.map(([v, n]) => `
              <label><input type="checkbox" data-campo="${esc(campo)}" value="${esc(v)}"${filtros[campo]?.has(v) ? " checked" : ""}> ${esc(v)} <small>${n}</small></label>`).join("")}
            </div>
          </details>`).join("")
        : `<p class="sin-filtros">${activa === TODAS ? "Elegí una categoría para ver sus filtros." : "Esta categoría todavía no tiene filtros."}</p>`;

      const activos = Object.entries(filtros).flatMap(([campo, set]) => [...set].map(v => [campo, v]));
      $("chips").innerHTML = activos.map(([campo, v]) => `<button type="button" class="chip" data-campo="${esc(campo)}" data-valor="${esc(v)}" aria-label="Quitar filtro ${esc(v)}">${esc(v)}</button>`).join("")
        + (activos.length ? `<button type="button" class="enlace" id="limpiar">Quitar todo</button>` : "");
    }

    function pintarPiezas() {
      const q = normalizar($("busqueda").value.trim());
      const campos = Object.values(FILTROS).flat().map(([campo]) => campo);
      const visibles = deCategoria(activa).filter(p =>
        Object.entries(filtros).every(([campo, set]) => set.has(p[campo])) &&
        (!q || normalizar([p.titulo, p.fecha, p.descripcion, p._cat.nombre, ...campos.map(c => p[c])].join(" ")).includes(q)));

      const orden = $("orden").value;
      if (orden === "precio-asc") visibles.sort((a, b) => precioDe(a) - precioDe(b));
      if (orden === "precio-desc") visibles.sort((a, b) => precioDe(b) - precioDe(a));
      if (orden === "titulo") visibles.sort((a, b) => String(a.titulo).localeCompare(String(b.titulo), "es"));

      const cat = categorias.find(c => c.slug === activa);
      $("titulo-lista").textContent = cat ? cat.nombre : "Todas las piezas";
      $("cantidad").textContent = visibles.length + (visibles.length === 1 ? " pieza" : " piezas");

      if (!visibles.length) {
        grilla.innerHTML = Object.keys(filtros).length || q
          ? `<p>Ninguna pieza coincide con lo elegido.</p>`
          : `<p>Todavía no hay piezas en venta en esta categoría.</p>`;
        return;
      }
      grilla.innerHTML = visibles.map(p => {
        const img = archivosDe(p)[0];
        return `
        <article class="pieza">
          <a href="pieza.html?c=${encodeURIComponent(p.collectionName)}&id=${encodeURIComponent(p.id)}">
            <div class="placa">${img ? `<img src="${esc(urlImagen(p, img, "400x0"))}" alt="${esc(p.titulo)}" loading="lazy">` : esc(String(p.titulo || "?").charAt(0))}</div>
            <h3>${esc(p.titulo)}</h3>
            <p class="detalle">${esc(p._cat.nombre)}${p.coleccion ? ". " + esc(p.coleccion) : ""}</p>
            <p class="precio">${esc(formatoPrecio(p))}</p>
            ${p.estado ? `<span class="estado ${p.estado === "Reservada" ? "reservada" : ""}">${esc(p.estado)}</span>` : ""}
          </a>
        </article>`;
      }).join("");
    }

    function pintar() {
      pintarCategorias();
      pintarFiltros();
      pintarPiezas();
    }

    $("lista-categorias").addEventListener("click", e => {
      const b = e.target.closest("button[data-cat]");
      if (!b) return;
      activa = b.dataset.cat;
      filtros = {};
      pintar();
    });

    $("filtros").addEventListener("change", e => {
      const { campo } = e.target.dataset;
      if (!campo) return;
      (filtros[campo] ||= new Set())[e.target.checked ? "add" : "delete"](e.target.value);
      if (!filtros[campo].size) delete filtros[campo];
      pintarFiltros();
      pintarPiezas();
    });

    $("chips").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.id === "limpiar") filtros = {};
      else {
        filtros[b.dataset.campo].delete(b.dataset.valor);
        if (!filtros[b.dataset.campo].size) delete filtros[b.dataset.campo];
      }
      pintarFiltros();
      pintarPiezas();
    });

    $("busqueda").addEventListener("input", pintarPiezas);
    $("orden").addEventListener("change", pintarPiezas);

    // Celular: el lateral se abre como cajón
    const cajon = abrir => { $("lateral").classList.toggle("abierto", abrir); $("velo").hidden = !abrir; };
    $("abrir").addEventListener("click", () => cajon(true));
    $("cerrar").addEventListener("click", () => cajon(false));
    $("velo").addEventListener("click", () => cajon(false));
    document.addEventListener("keydown", e => { if (e.key === "Escape") cajon(false); });

    async function iniciar() {
      try {
        categorias = await listarCategorias();
        const grupos = await Promise.all(categorias.map(async c => {
          const items = await listarPiezas(c.coleccion || c.slug);
          return items.map(p => ({ ...p, _cat: c }));
        }));
        piezas = grupos.flat();
        pintar();
      } catch (err) {
        console.error(err);
        grilla.innerHTML = `<div class="vacio"><h1>No se pudo cargar el catálogo</h1><p>Revisá que PocketBase esté corriendo y que la dirección en api.js sea la correcta.</p></div>`;
      }
    }
    iniciar();
  </script>
</body>
</html>
