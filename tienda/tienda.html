<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pródigo – Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body data-theme="papel" data-seccion="tienda">

  <header class="cabecera" id="cabecera"></header>
  <script src="cabecera.js?v=4"></script>

  <div class="disposicion">
    <aside class="lateral" id="lateral" aria-label="Categorías y filtros">
      <div class="lateral-cabeza"><span class="marca">Filtrar</span><button type="button" id="cerrar" aria-label="Cerrar">×</button></div>
      <h2 class="etiqueta">Categorías</h2>
      <ul class="lista-cats" id="lista-categorias"></ul>
      <div id="filtros"></div>
    </aside>

    <main aria-live="polite">
      <div class="barra-lista">
        <div>
          <h1 id="titulo-lista">Todas las piezas</h1>
          <p id="cantidad"></p>
        </div>
        <div class="herramientas">
          <button type="button" class="boton-filtros" id="abrir">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            Filtrar
          </button>
          <label class="buscador">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="busqueda" placeholder="Buscar piezas" aria-label="Buscar piezas">
          </label>
          <label class="orden">Ordenar
            <select id="orden">
              <option value="">Más recientes</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="titulo">Título A–Z</option>
              <option value="fecha-asc">Fecha: más antiguas</option>
              <option value="fecha-desc">Fecha: más recientes</option>
            </select>
          </label>
          <label class="orden">Vista
            <select id="vista">
              <option value="0">Miniaturas pequeñas</option>
              <option value="1">Miniaturas medianas</option>
              <option value="2" selected>Miniaturas grandes</option>
              <option value="3">Vista previa</option>
            </select>
          </label>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="grilla" id="grilla" data-tamano="2"><p>Cargando…</p></div>
    </main>
  </div>
  <div class="velo" id="velo" hidden></div>

  <script src="api.js?v=4"></script>
  <script>
    const TODAS = "todas";
    let categorias = [];
    let piezas = [];
    let activa = TODAS;
    // Filtros elegidos: clave del grupo -> Set de valores. Dentro de un grupo es "o", entre grupos es "y".
    let filtros = {};
    let periodo = null;          // [desde, hasta] elegido, o null si no se filtra por período
    const abiertos = new Set();  // grupos desplegados
    const vistos = new Set();    // grupos que ya se mostraron alguna vez
    const busquedas = {};        // texto escrito en el buscador de cada grupo

    const $ = id => document.getElementById(id);
    const grilla = $("grilla");

    const deCategoria = slug => slug === TODAS ? piezas : piezas.filter(p => p._cat.slug === slug);
    const precioDe = p => Number(p.precio_usd ?? p.precio) || 0;

    // Grupos de filtros: la colección y los campos propios marcados como filtro
    // (en "Todas", los de todas las categorías; un grupo sin opciones no se muestra).
    function grupos() {
      const cats = activa === TODAS ? categorias : categorias.filter(c => c.slug === activa);
      const lista = [{ clave: "coleccion", etiqueta: "Colección", valores: p => p._colec ? [p._colec.nombre] : [] }];
      cats.flatMap(camposDe).filter(c => c.filtro).forEach(c => {
        if (!lista.some(g => g.clave === c.clave)) lista.push({ clave: c.clave, etiqueta: c.etiqueta, valores: p => valoresCampo(p, c) });
      });
      return lista;
    }

    const enPeriodo = p => {
      if (!periodo) return true;
      const a = periodoDe(p);
      return !!a && a[0] <= periodo[1] && a[1] >= periodo[0];
    };

    // Piezas que cumplen la búsqueda y los filtros (menos el grupo "salvo", para contar sus opciones)
    function filtrar(lista, gs, salvo) {
      const q = normalizar($("busqueda").value.trim());
      return lista.filter(p =>
        (!q || textoDe(p).includes(q)) &&
        (salvo === "periodo" || enPeriodo(p)) &&
        gs.every(g => g.clave === salvo || !filtros[g.clave] || g.valores(p).some(v => filtros[g.clave].has(v))));
    }

    function pintarCategorias() {
      const items = [{ slug: TODAS, nombre: "Todas" }, ...categorias];
      $("lista-categorias").innerHTML = items.map(c => `<li><button type="button" data-cat="${esc(c.slug)}" aria-pressed="${c.slug === activa}">
        <span>${esc(c.nombre)}</span><span>${deCategoria(c.slug).length}</span></button></li>`).join("");
    }

    function pintarFiltros() {
      const enCat = deCategoria(activa);
      const gs = grupos();
      let html = "";
      gs.forEach((g, i) => {
        // Cuántas piezas quedarían con cada opción, respetando los demás filtros elegidos
        const cuenta = {};
        filtrar(enCat, gs, g.clave).forEach(p => new Set(g.valores(p)).forEach(v => cuenta[v] = (cuenta[v] || 0) + 1));
        const elegidos = filtros[g.clave] || new Set();
        elegidos.forEach(v => cuenta[v] ??= 0);
        const vals = Object.entries(cuenta).sort((a, b) =>
          (elegidos.has(b[0]) - elegidos.has(a[0])) || a[0].localeCompare(b[0], "es", { numeric: true }));
        if (!vals.length) return;
        // Los dos primeros grupos arrancan abiertos (la primera vez que aparecen), y los que tienen algo elegido
        if (!vistos.has(g.clave) && i < 2 || elegidos.size) abiertos.add(g.clave);
        vistos.add(g.clave);
        const largas = vals.length >= 8;
        html += `
          <details class="grupo" data-grupo="${esc(g.clave)}"${abiertos.has(g.clave) ? " open" : ""}>
            <summary>${esc(g.etiqueta)}<small>${vals.length}</small></summary>
            ${largas ? `<input type="search" class="buscar-opcion" data-grupo="${esc(g.clave)}" placeholder="Buscar en ${esc(g.etiqueta.toLowerCase())}" aria-label="Buscar en ${esc(g.etiqueta)}" value="${esc(busquedas[g.clave] || "")}">` : ""}
            <div class="opciones${largas ? " largas" : ""}">${vals.map(([v, n]) => `
              <label data-texto="${esc(normalizar(v))}"><input type="checkbox" data-campo="${esc(g.clave)}" value="${esc(v)}"${elegidos.has(v) ? " checked" : ""}> ${esc(v)} <small>${n}</small></label>`).join("")}
            </div>
          </details>`;
      });

      // Período: entre el año más antiguo y el más reciente de la categoría
      const anios = enCat.map(periodoDe).filter(Boolean).flat();
      if (anios.length) {
        const min = Math.min(...anios), max = Math.max(...anios);
        const [d, h] = periodo || [min, max];
        html += `
          <details class="grupo" data-grupo="periodo"${abiertos.has("periodo") || periodo ? " open" : ""}>
            <summary>Período<small>${min}–${max}</small></summary>
            <div class="periodo">
              <span>Desde <strong id="anio-desde">${d}</strong> hasta <strong id="anio-hasta">${h}</strong></span>
              <input type="range" id="rango-desde" min="${min}" max="${max}" value="${d}" aria-label="Desde el año">
              <input type="range" id="rango-hasta" min="${min}" max="${max}" value="${h}" aria-label="Hasta el año">
            </div>
          </details>`;
      }

      $("filtros").innerHTML = html
        ? `<h2 class="etiqueta">Filtros</h2>` + html
        : `<p class="sin-filtros">Esta categoría todavía no tiene filtros.</p>`;
      document.querySelectorAll(".buscar-opcion").forEach(filtrarOpciones);

      const etiqueta = clave => gs.find(g => g.clave === clave)?.etiqueta || clave;
      const activos = Object.entries(filtros).flatMap(([campo, set]) => [...set].map(v => [campo, v]));
      $("chips").innerHTML = activos.map(([campo, v]) => `<button type="button" class="chip" data-campo="${esc(campo)}" data-valor="${esc(v)}" aria-label="Quitar filtro ${esc(etiqueta(campo))}: ${esc(v)}">${esc(v)}</button>`).join("")
        + (periodo ? `<button type="button" class="chip" data-campo="periodo" aria-label="Quitar filtro de período">${periodo[0]}–${periodo[1]}</button>` : "")
        + (activos.length || periodo ? `<button type="button" class="enlace" id="limpiar">Quitar todo</button>` : "");
    }

    // Buscador dentro de un grupo largo: oculta las opciones que no coinciden
    function filtrarOpciones(input) {
      const q = normalizar(input.value.trim());
      busquedas[input.dataset.grupo] = input.value;
      input.nextElementSibling.querySelectorAll("label").forEach(l => l.hidden = !!q && !l.dataset.texto.includes(q));
    }

    function pintarPiezas() {
      const visibles = filtrar(deCategoria(activa), grupos());

      const orden = $("orden").value;
      const anio = p => periodoDe(p)?.[0];
      // Las piezas sin fecha van al final en los dos sentidos
      const porFecha = signo => (a, b) => (anio(a) == null) - (anio(b) == null) || signo * ((anio(a) ?? 0) - (anio(b) ?? 0));
      if (orden === "precio-asc") visibles.sort((a, b) => precioDe(a) - precioDe(b));
      if (orden === "precio-desc") visibles.sort((a, b) => precioDe(b) - precioDe(a));
      if (orden === "titulo") visibles.sort((a, b) => String(a.titulo).localeCompare(String(b.titulo), "es"));
      if (orden === "fecha-asc") visibles.sort(porFecha(1));
      if (orden === "fecha-desc") visibles.sort(porFecha(-1));

      const cat = categorias.find(c => c.slug === activa);
      $("titulo-lista").textContent = cat ? cat.nombre : "Todas las piezas";
      $("cantidad").textContent = visibles.length + (visibles.length === 1 ? " pieza" : " piezas");

      if (!visibles.length) {
        grilla.innerHTML = Object.keys(filtros).length || periodo || $("busqueda").value.trim()
          ? `<p>Ninguna pieza coincide con lo elegido.</p>`
          : `<p>Todavía no hay piezas en venta en esta categoría.</p>`;
        return;
      }
      // En "Vista previa" las imágenes se ven grandes: se pide la versión de 1200 px
      const miniatura = $("vista").value === "3" ? "1200x0" : "400x0";
      grilla.innerHTML = visibles.map(p => {
        const img = archivosDe(p)[0];
        return `
        <article class="pieza">
          <a href="pieza.html?id=${encodeURIComponent(p.id)}">
            <div class="placa">${img ? `<img src="${esc(urlImagen(p, img, miniatura))}" alt="${esc(p.titulo)}" loading="lazy">` : esc(String(p.titulo || "?").charAt(0))}</div>
            <h3>${esc(p.titulo)}</h3>
            <p class="detalle">${esc(p._cat.nombre)}${p._colec ? ". " + esc(p._colec.nombre) : ""}</p>
            <p class="precio">${esc(formatoPrecio(p))}</p>
            ${p.estado ? `<span class="estado ${p.estado === "Reservada" ? "reservada" : ""}">${esc(p.estado)}</span>` : ""}
          </a>
        </article>`;
      }).join("");
    }

    function pintar() {
      pintarCategorias();
      pintarFiltros();
      pintarPiezas();
    }

    $("lista-categorias").addEventListener("click", e => {
      const b = e.target.closest("button[data-cat]");
      if (!b) return;
      activa = b.dataset.cat;
      filtros = {};
      periodo = null;
      pintar();
    });

    $("filtros").addEventListener("change", e => {
      const { campo } = e.target.dataset;
      if (campo) {
        (filtros[campo] ||= new Set())[e.target.checked ? "add" : "delete"](e.target.value);
        if (!filtros[campo].size) delete filtros[campo];
      } else if (!e.target.matches("input[type=range]")) return;
      pintarFiltros();
      pintarPiezas();
    });

    // Mientras se arrastra el período solo se actualiza la grilla; al soltar ("change"), también los filtros
    $("filtros").addEventListener("input", e => {
      if (e.target.matches(".buscar-opcion")) return filtrarOpciones(e.target);
      if (!e.target.matches("input[type=range]")) return;
      const desde = $("rango-desde"), hasta = $("rango-hasta");
      let d = Number(desde.value), h = Number(hasta.value);
      if (d > h) e.target === desde ? (h = d, hasta.value = h) : (d = h, desde.value = d);
      periodo = d === Number(desde.min) && h === Number(desde.max) ? null : [d, h];
      $("anio-desde").textContent = d;
      $("anio-hasta").textContent = h;
      pintarPiezas();
    });

    // Recordar qué grupos quedaron abiertos al volver a dibujar los filtros
    $("filtros").addEventListener("toggle", e => {
      const g = e.target.dataset?.grupo;
      if (g) e.target.open ? abiertos.add(g) : abiertos.delete(g);
    }, true);

    $("chips").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.id === "limpiar") { filtros = {}; periodo = null; }
      else if (b.dataset.campo === "periodo") periodo = null;
      else {
        filtros[b.dataset.campo].delete(b.dataset.valor);
        if (!filtros[b.dataset.campo].size) delete filtros[b.dataset.campo];
      }
      pintarFiltros();
      pintarPiezas();
    });

    $("busqueda").addEventListener("input", () => { pintarFiltros(); pintarPiezas(); });
    $("orden").addEventListener("change", pintarPiezas);

    // Tamaño de las imágenes (como en el visor de colecciones fotográficas); se recuerda en este navegador
    const CLAVE_VISTA = "prodigo-vista";
    try {
      const guardada = localStorage.getItem(CLAVE_VISTA);
      if ([...$("vista").options].some(o => o.value === guardada)) $("vista").value = guardada;
    } catch (_) {}
    grilla.dataset.tamano = $("vista").value;
    $("vista").addEventListener("change", () => {
      grilla.dataset.tamano = $("vista").value;
      try { localStorage.setItem(CLAVE_VISTA, $("vista").value); } catch (_) {}
      pintarPiezas();
    });

    // Celular: el lateral se abre como cajón
    const cajon = abrir => { $("lateral").classList.toggle("abierto", abrir); $("velo").hidden = !abrir; };
    $("abrir").addEventListener("click", () => cajon(true));
    $("cerrar").addEventListener("click", () => cajon(false));
    $("velo").addEventListener("click", () => cajon(false));
    document.addEventListener("keydown", e => { if (e.key === "Escape") cajon(false); });

    async function iniciar() {
      try {
        ({ categorias, piezas } = await cargarCatalogo({ soloVenta: true }));
        piezas.sort((a, b) => String(b.created).localeCompare(String(a.created)));   // más recientes primero
        pintar();
      } catch (err) {
        console.error(err);
        grilla.innerHTML = `<div class="vacio"><h1>No se pudo cargar el catálogo</h1><p>${MODO_DEMO
          ? "Probá recargar la página en un momento."
          : "Revisá que PocketBase esté corriendo y que la dirección en api.js sea la correcta."}</p></div>`;
      }
    }
    iniciar();
  </script>
</body>
</html>
