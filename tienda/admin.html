<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pródigo – Panel de administración</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .panel { max-width: 72rem; margin: 0 auto; padding: 2rem clamp(1rem, 4vw, 3rem) 5rem; }
    .panel h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: clamp(2rem, 4vw, 2.75rem); line-height: 1.1; }
    .panel h2 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.5rem; }
    .intro { color: var(--tinta-suave); margin: 0.35rem 0 2rem; }
    .sesion { display: flex; justify-content: flex-end; gap: 0.5rem; font-size: 0.9rem; color: var(--tinta-suave); margin-bottom: 1rem; }
    .sesion button { background: none; border: 0; padding: 0; color: var(--tinta-suave); text-decoration: underline; cursor: pointer; font: inherit; }
    .aviso { background: #f6e3df; color: #6e231d; border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 1.5rem; }
    .aviso.ok { background: color-mix(in srgb, var(--acento) 12%, var(--superficie)); color: var(--tinta); }
    [hidden] { display: none !important; }

    /* Ingreso */
    .ingreso { max-width: 26rem; }
    .campo { margin-bottom: 1.25rem; }
    .campo label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    .panel input[type=email], .panel input[type=password], .panel input[type=search], .panel select {
      width: 100%; font: inherit; color: var(--tinta); background: var(--superficie);
      border: 1px solid var(--linea); border-radius: 6px; padding: 0.65rem 0.8rem;
    }
    .panel input:focus, .panel select:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
    .panel .boton { border: 0; font: inherit; cursor: pointer; }

    /* Menú: acciones principales y totales generales */
    .encabezado-panel { display: flex; justify-content: space-between; align-items: center; gap: 0 1.5rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
    .encabezado-panel .intro { margin-bottom: 0; }
    .totales { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .totales div { background: var(--superficie); border: 1px solid var(--linea); border-radius: 10px; padding: 0.9rem 1.1rem; }
    .totales small { display: block; color: var(--tinta-suave); font-size: 0.8rem; }
    .totales strong { font-size: 1.75rem; font-weight: 600; line-height: 1.2; }

    /* Lista lateral de categorías (pensada para muchas: buscador, orden y barra de tamaño) */
    .cuerpo-panel { display: grid; grid-template-columns: 18rem minmax(0, 1fr); gap: 2rem; align-items: start; }
    .cats {
      position: sticky; top: 5.5rem; max-height: calc(100vh - 7rem); display: flex; flex-direction: column;
      background: var(--superficie); border: 1px solid var(--linea); border-radius: 10px;
    }
    .cats-cabeza { padding: 0.9rem 1rem 0.75rem; border-bottom: 1px solid var(--linea); display: grid; gap: 0.6rem; }
    .cats-cabeza div { display: flex; justify-content: space-between; align-items: baseline; }
    .panel .cats-cabeza h2 { font-size: 1.2rem; }
    .cats-cabeza .orden { all: unset; cursor: pointer; font-size: 0.8rem; color: var(--tinta-suave); text-decoration: underline; text-underline-offset: 3px; }
    .panel .cats-cabeza input { padding: 0.45rem 0.7rem; font-size: 0.9rem; }
    .cats ul { list-style: none; padding: 0.35rem; overflow-y: auto; }
    .cats li button {
      all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.15rem 0.5rem; align-items: center;
      padding: 0.5rem 0.65rem; border-radius: 6px;
    }
    .cats li button:hover { background: var(--fondo); }
    .cats li button:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
    .cats li button[aria-pressed="true"] { background: var(--acento); color: var(--acento-texto); }
    .cats li button[aria-pressed="true"] .barra { background: rgb(255 255 255 / 0.25); }
    .cats li button[aria-pressed="true"] .barra i { background: var(--acento-texto); }
    .cats .nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.92rem; }
    .cats .n { font-size: 0.8rem; font-variant-numeric: tabular-nums; opacity: 0.75; }
    .cats .barra { grid-column: 1 / -1; height: 3px; border-radius: 3px; background: var(--linea); overflow: hidden; }
    .cats .barra i { display: block; height: 100%; background: var(--acento); }
    .cats .todas { border-bottom: 1px solid var(--linea); margin-bottom: 0.25rem; padding-bottom: 0.25rem; }
    .cats .nada { padding: 0.75rem; font-size: 0.85rem; color: var(--tinta-suave); }
    .selector-cat { display: none; }

    /* Listado de piezas */
    .titulo-lista { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 0.25rem; }
    .titulo-lista button { all: unset; cursor: pointer; font-size: 0.85rem; color: var(--tinta-suave); text-decoration: underline; text-underline-offset: 3px; }
    .herramientas { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 0.5rem 0 0.75rem; }
    .panel .herramientas input { flex: 1 1 18rem; width: auto; }
    .estados { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .estados button { border: 1px solid var(--linea); background: var(--superficie); border-radius: 999px; padding: 0.4rem 0.85rem; font: inherit; font-size: 0.85rem; color: inherit; cursor: pointer; }
    .estados button[aria-pressed="true"] { background: var(--tinta); color: var(--fondo); border-color: var(--tinta); }
    .mas { display: block; margin: 1.25rem auto 0; background: none; border: 1px solid var(--linea); border-radius: 999px; padding: 0.6rem 1.4rem; font: inherit; color: inherit; cursor: pointer; }
    .mas:hover { border-color: var(--acento); }
    .cantidad { color: var(--tinta-suave); font-size: 0.9rem; margin-bottom: 0.75rem; }
    .lista { list-style: none; padding: 0; border-top: 1px solid var(--linea); }
    .fila {
      display: grid; grid-template-columns: 64px minmax(0, 1fr) auto auto; gap: 1rem; align-items: center;
      padding: 0.75rem 0; border-bottom: 1px solid var(--linea);
    }
    .fila img, .fila .sin-foto { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: var(--placa); display: block; }
    .fila .titulo { font-weight: 600; }
    .fila .datos { font-size: 0.85rem; color: var(--tinta-suave); }
    .etiqueta { display: inline-block; font-size: 0.72rem; padding: 0.05rem 0.5rem; border-radius: 999px; border: 1px solid var(--linea); margin-left: 0.35rem; white-space: nowrap; }
    .etiqueta.oculta { background: var(--tinta-suave); color: var(--fondo); border-color: var(--tinta-suave); }
    .fila .precio { font-weight: 600; white-space: nowrap; }
    .fila .acciones { display: flex; gap: 0.4rem; align-items: center; }
    .chico { padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 4px; text-decoration: none; }
    .chico.secundario { background: transparent; color: var(--acento); box-shadow: inset 0 0 0 1px var(--acento); }
    .chico.peligro { background: transparent; color: #a3322b; box-shadow: inset 0 0 0 1px #a3322b; }
    .chico[disabled] { opacity: 0.6; cursor: wait; }
    .ver { font-size: 0.85rem; color: var(--tinta-suave); margin-right: 0.25rem; }

    /* En pantallas chicas la lista de categorías se abre como hoja desde abajo */
    @media (max-width: 860px) {
      .cuerpo-panel { grid-template-columns: 1fr; }
      .cats { display: none; }
      .cats.abierto { display: flex; position: fixed; inset: auto 0 0 0; z-index: 40; max-height: 75vh; border-radius: 14px 14px 0 0; box-shadow: 0 -10px 40px rgb(0 0 0 / 0.2); }
      .selector-cat {
        display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 1rem;
        padding: 0.7rem 0.9rem; background: var(--superficie); border: 1px solid var(--linea); border-radius: 8px; font: inherit; color: inherit; cursor: pointer;
      }
      .velo { position: fixed; inset: 0; z-index: 35; background: rgb(38 35 30 / 0.4); }
      .totales { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 700px) {
      .fila { grid-template-columns: 56px minmax(0, 1fr); }
      .fila img, .fila .sin-foto { width: 56px; height: 56px; }
      .fila .precio, .fila .acciones { grid-column: 2; }
    }
  </style>
</head>
<body data-theme="papel">

  <header class="cabecera" id="cabecera"></header>
  <script src="cabecera.js"></script>

  <main class="panel">

    <!-- 1. Ingreso -->
    <section id="vista-ingreso" class="ingreso" hidden>
      <h1>Panel de administración</h1>
      <p class="intro">Ingresá con tu cuenta de editor o de administrador.</p>
      <div class="aviso" id="error-ingreso" role="alert" hidden></div>
      <form id="form-ingreso">
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" autocomplete="current-password" required>
        </div>
        <button class="boton" type="submit">Ingresar</button>
      </form>
    </section>

    <!-- 2. Panel -->
    <section id="vista-panel" hidden>
      <div class="sesion"><span id="quien"></span>·<button type="button" id="salir">Cerrar sesión</button></div>
      <div class="encabezado-panel">
        <div>
          <h1>Panel de administración</h1>
          <p class="intro">Cargá piezas nuevas o buscá una para modificarla o eliminarla.</p>
        </div>
        <a class="boton" href="cargar.html">+ Cargar pieza nueva</a>
      </div>

      <div class="aviso" id="aviso" role="status" hidden></div>
      <div class="totales" id="totales"></div>

      <div class="cuerpo-panel">
        <aside class="cats" id="cats" aria-label="Categorías">
          <div class="cats-cabeza">
            <div><h2 id="cats-titulo">Categorías</h2><button type="button" class="orden" id="orden-cats" title="Cambiar el orden"></button></div>
            <input type="search" id="buscar-cat" placeholder="Buscar categoría" aria-label="Buscar categoría">
          </div>
          <ul id="lista-cats"></ul>
        </aside>

        <section aria-labelledby="titulo-piezas">
          <button type="button" class="selector-cat" id="abrir-cats"><span id="cat-actual"></span><span>Cambiar ▾</span></button>
          <div class="titulo-lista"><h2 id="titulo-piezas">Todas las piezas</h2><button type="button" id="ver-todas" hidden>Ver todas las categorías</button></div>
          <div class="herramientas">
            <input type="search" id="buscar" placeholder="Buscar por título, inventario, marca, lugar, fotógrafo…" aria-label="Buscar piezas">
            <div class="estados" id="estados" role="group" aria-label="Estado"></div>
          </div>
          <p class="cantidad" id="cantidad" aria-live="polite"></p>
          <ul class="lista" id="lista"><li class="fila">Cargando…</li></ul>
          <button type="button" class="mas" id="mas" hidden></button>
        </section>
      </div>
    </section>
  </main>
  <div class="velo" id="velo" hidden></div>

  <script src="api.js"></script>
  <script src="sesion.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let sesion = null;
    let categorias = [];
    let piezas = [];

    function mostrar(vista) {
      ["vista-ingreso", "vista-panel"].forEach(v => $(v).hidden = v !== vista);
    }

    function avisar(texto, ok) {
      $("aviso").textContent = texto;
      $("aviso").classList.toggle("ok", !!ok);
      $("aviso").hidden = !texto;
    }

    // ---------- Ingreso ----------

    $("form-ingreso").addEventListener("submit", async e => {
      e.preventDefault();
      const boton = e.submitter;
      boton.disabled = true;
      $("error-ingreso").hidden = true;
      try {
        sesion = await ingresar($("correo").value.trim(), $("clave").value);
        if (!sesion) {
          $("error-ingreso").textContent = "El correo o la contraseña no son correctos.";
          $("error-ingreso").hidden = false;
          return;
        }
        recordarSesion(sesion);
        $("clave").value = "";
        abrirPanel();
      } catch (err) {
        console.error(err);
        $("error-ingreso").textContent = "No se pudo conectar con el servidor. Probá de nuevo en un momento.";
        $("error-ingreso").hidden = false;
      } finally {
        boton.disabled = false;
      }
    });

    $("salir").addEventListener("click", () => {
      sesion = null;
      recordarSesion(null);
      mostrar("vista-ingreso");
    });

    // ---------- Panel ----------

    async function abrirPanel() {
      $("quien").textContent = "Ingresaste como " + sesion.nombre;
      mostrar("vista-panel");
      try {
        categorias = await listarCategorias();
        const grupos = await Promise.all(categorias.map(async c => {
          if (MODO_DEMO) return (await demo(c.coleccion || c.slug)).map(p => ({ ...p, _cat: c }));
          // shortcut: hasta 500 piezas por categoría en una sola consulta; paginar si alguna crece más
          const r = await fetch(`${PB_URL}/api/collections/${c.coleccion || c.slug}/records?sort=inventario&perPage=500`,
            { headers: { Authorization: sesion.token } });
          if (r.status === 401 || r.status === 403) throw new Error("sesion");
          if (!r.ok) throw new Error("PocketBase respondió " + r.status);
          return (await r.json()).items.map(p => ({ ...p, _cat: c }));
        }));
        piezas = grupos.flat();
      } catch (err) {
        console.error(err);
        if (err.message === "sesion") {
          recordarSesion(null);
          $("error-ingreso").textContent = "Tu sesión venció. Volvé a ingresar.";
          $("error-ingreso").hidden = false;
          return mostrar("vista-ingreso");
        }
        $("lista").innerHTML = "";
        return avisar("No se pudieron traer las piezas. Revisá que PocketBase esté corriendo.");
      }
      pintarTodo();
    }

    const enTienda = p => p.visible && p.destino === DESTINO_VENTA;
    const deCat = slug => slug ? piezas.filter(p => p._cat.slug === slug) : piezas;
    const POR_PAGINA = 40;
    let catActiva = "";       // "" = todas
    let estadoActivo = "";
    let ordenCats = "nombre"; // o "cantidad"
    let limite = POR_PAGINA;

    // Filtros rápidos por estado: [id, etiqueta, condición]
    const ESTADOS = [
      ["", "Todas", () => true],
      ["tienda", "En la tienda", enTienda],
      ["reservada", "Reservadas", p => p.destino === DESTINO_VENTA && p.estado === "Reservada"],
      ["oculta", "Ocultas", p => !p.visible],
      ["fuera", "Fuera de venta", p => p.destino !== DESTINO_VENTA],
    ];

    function pintarTodo() {
      pintarTotales();
      pintarCats();
      pintarLista();
    }

    function pintarTotales() {
      const datos = [["Piezas", piezas.length], ...ESTADOS.slice(1, 4).map(([, nombre, f]) => [nombre, piezas.filter(f).length])];
      $("totales").innerHTML = datos.map(([t, n]) => `<div><small>${t}</small><strong>${n.toLocaleString("es-AR")}</strong></div>`).join("");
    }

    function pintarCats() {
      const q = normalizar($("buscar-cat").value);
      const lista = categorias.map(c => ({ c, de: deCat(c.slug) })).filter(({ c }) => !q || normalizar(c.nombre).includes(q));
      lista.sort(ordenCats === "nombre" ? (a, b) => a.c.nombre.localeCompare(b.c.nombre, "es") : (a, b) => b.de.length - a.de.length);
      const max = Math.max(1, ...categorias.map(c => deCat(c.slug).length));
      const boton = (slug, nombre, de) => `<li${slug ? "" : ' class="todas"'}>
        <button type="button" data-cat="${esc(slug)}" aria-pressed="${catActiva === slug}" title="${de.filter(enTienda).length} de ${de.length} en la tienda">
          <span class="nombre">${esc(nombre)}</span><span class="n">${de.length}</span>
          ${slug ? `<span class="barra"><i style="width:${(de.length / max) * 100}%"></i></span>` : ""}
        </button></li>`;
      $("lista-cats").innerHTML = (q ? "" : boton("", "Todas las categorías", piezas))
        + (lista.length ? lista.map(({ c, de }) => boton(c.slug, c.nombre, de)).join("") : `<li class="nada">Ninguna categoría coincide.</li>`);
      $("cats-titulo").textContent = `Categorías (${categorias.length})`;
      $("orden-cats").textContent = ordenCats === "nombre" ? "A–Z" : "Más piezas";
    }

    // Busca sin importar mayúsculas ni tildes, en todos los datos de texto de la pieza
    const normalizar = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

    function pintarLista() {
      const base = deCat(catActiva);
      const nombre = categorias.find(c => c.slug === catActiva)?.nombre;
      $("titulo-piezas").textContent = nombre || "Todas las piezas";
      $("cat-actual").textContent = nombre || `Todas las categorías (${categorias.length})`;
      $("ver-todas").hidden = !catActiva;
      $("estados").innerHTML = ESTADOS.map(([id, etiqueta, f]) =>
        `<button type="button" data-estado="${id}" aria-pressed="${estadoActivo === id}">${etiqueta} · ${base.filter(f).length}</button>`).join("");

      const condicion = ESTADOS.find(e => e[0] === estadoActivo)[2];
      const palabras = normalizar($("buscar").value).split(/\s+/).filter(Boolean);
      const visibles = base.filter(p => {
        if (!condicion(p)) return false;
        const texto = normalizar(Object.values(p).filter(v => typeof v === "string").join(" ") + " " + p._cat.nombre);
        return palabras.every(w => texto.includes(w));
      });
      $("cantidad").textContent = visibles.length + (visibles.length === 1 ? " pieza" : " piezas");
      const resto = visibles.length - limite;
      $("mas").hidden = resto <= 0;
      $("mas").textContent = `Mostrar ${Math.min(resto, POR_PAGINA)} más (quedan ${resto})`;
      if (!visibles.length) {
        $("lista").innerHTML = `<li class="fila" style="display:block">Ninguna pieza coincide con la búsqueda.</li>`;
        return;
      }
      $("lista").innerHTML = visibles.slice(0, limite).map(p => {
        const foto = archivosDe(p)[0];
        const enlace = `c=${encodeURIComponent(p.collectionName)}&id=${encodeURIComponent(p.id)}`;
        const etiquetas = [
          !p.visible ? `<span class="etiqueta oculta">Oculta</span>` : "",
          p.destino !== DESTINO_VENTA ? `<span class="etiqueta">${esc(p.destino || "Sin Definir")}</span>` : "",
          p.estado && p.destino === DESTINO_VENTA && p.estado !== "Disponible" ? `<span class="etiqueta">${esc(p.estado)}</span>` : "",
        ].join("");
        return `
        <li class="fila">
          ${foto ? `<img src="${esc(urlImagen(p, foto, "100x100"))}" alt="" loading="lazy">` : `<span class="sin-foto"></span>`}
          <div>
            <div class="titulo">${esc(p.titulo)}${etiquetas}</div>
            <div class="datos">${esc(p.inventario || "")} · ${esc(p._cat.nombre)}</div>
          </div>
          <div class="precio">${esc(formatoPrecio(p))}</div>
          <div class="acciones">
            ${enTienda(p) ? `<a class="ver" href="pieza.html?${enlace}" target="_blank">Ver</a>` : ""}
            <a class="boton chico secundario" href="cargar.html?${enlace}">Modificar</a>
            <button type="button" class="boton chico peligro" data-eliminar="${esc(p.id)}">Eliminar</button>
          </div>
        </li>`;
      }).join("");
    }

    // Cualquier cambio de filtro vuelve a la primera página del listado
    const refiltrar = () => { limite = POR_PAGINA; pintarLista(); };
    const cajonCats = abrir => { $("cats").classList.toggle("abierto", abrir); $("velo").hidden = !abrir; };
    const elegirCat = slug => { catActiva = slug; cajonCats(false); pintarCats(); refiltrar(); };

    $("buscar").addEventListener("input", refiltrar);
    $("lista-cats").addEventListener("click", e => {
      const b = e.target.closest("button[data-cat]");
      if (b) elegirCat(b.dataset.cat);
    });
    $("ver-todas").addEventListener("click", () => elegirCat(""));
    $("buscar-cat").addEventListener("input", pintarCats);
    $("orden-cats").addEventListener("click", () => { ordenCats = ordenCats === "nombre" ? "cantidad" : "nombre"; pintarCats(); });
    $("estados").addEventListener("click", e => {
      const b = e.target.closest("button[data-estado]");
      if (b) { estadoActivo = b.dataset.estado; refiltrar(); }
    });
    $("mas").addEventListener("click", () => { limite += POR_PAGINA; pintarLista(); });
    $("abrir-cats").addEventListener("click", () => cajonCats(true));
    $("velo").addEventListener("click", () => cajonCats(false));
    document.addEventListener("keydown", e => { if (e.key === "Escape") cajonCats(false); });

    $("lista").addEventListener("click", async e => {
      const b = e.target.closest("[data-eliminar]");
      if (!b) return;
      const p = piezas.find(x => x.id === b.dataset.eliminar);
      if (!confirm(`¿Eliminar «${p.titulo}» (${p.inventario})?\n\nSe borra la pieza con todas sus fotos y no se puede deshacer.`)) return;
      if (MODO_DEMO) {
        piezas = piezas.filter(x => x !== p);
        avisar(`«${p.titulo}» se eliminó (demostración: al recargar la página vuelve a aparecer).`, true);
        return pintarTodo();
      }
      b.disabled = true;
      try {
        const r = await fetch(`${PB_URL}/api/collections/${encodeURIComponent(p.collectionName)}/records/${encodeURIComponent(p.id)}`, {
          method: "DELETE", headers: { Authorization: sesion.token },
        });
        if (!r.ok) {
          b.disabled = false;
          return avisar(r.status === 401 || r.status === 403
            ? "Tu sesión venció o no tenés permiso para eliminar. Cerrá sesión y volvé a ingresar."
            : "No se pudo eliminar la pieza. Probá de nuevo.");
        }
        piezas = piezas.filter(x => x !== p);
        avisar(`«${p.titulo}» se eliminó.`, true);
        pintarTodo();
      } catch (err) {
        console.error(err);
        b.disabled = false;
        avisar("No se pudo conectar con el servidor. Revisá la conexión y probá de nuevo.");
      }
    });

    // ---------- Inicio ----------

    (async function iniciar() {
      sesion = await sesionVigente();
      if (sesion) return abrirPanel();
      mostrar("vista-ingreso");
    })();
  </script>
</body>
